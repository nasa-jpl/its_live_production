#
# Configuration file to create conda environment to run ItsLiveCube related code.
#
# To create conda environment, run command:
#
# $ conda env create -f composite_environment.yml
#
# Followed by the following command to activate the environment:
#
# $ conda activate itslive_composites
#
name: itslive_composites
channels:
  - conda-forge

dependencies:
  # Core Python
  - python=3.10.*

  # Scientific computing
  - scipy>=1.9,<2.0
  - pandas=1.5.*
  - numpy>=1.23,<2.0
  - numba>=0.57

  # Geospatial packages
  - geopandas
  - fiona  # No version constraint
  - shapely=2.0.1
  - pyproj
  - rasterio=1.3.*

  # Data handling
  - xarray=2023.1.*
  - rioxarray==0.15.0
  - h5py=3.9.0
  - h5netcdf
  - netcdf4
  - zarr=2.17.*

  # AWS and web
  - requests>=2.28
  - s3fs>=2022.1.0
  - fsspec>=2022.1.0
  - boto3>=1.26
  - awscli
  # - pystac-client

  # Utilities
  - tqdm>=4.65
  - utm
  - flake8=6.0.0
  - geojson==3.0.1

  # Pip dependencies
  - pip
  - pip:
    - itslive>=0.7.3
    - tqdm_joblib
