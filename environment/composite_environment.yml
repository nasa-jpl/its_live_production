#
# Configuration file to create conda environment to run ItsLiveCube related code.
#
# To create conda environment, run command:
#
# $ conda env create -f composite_environment.yml
#
# Followed by the following command to activate the environment:
#
# $ conda activate itslivecube
#
name: itslivecube
channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.9.*

  # Scientific computing
  - numpy=1.21.*
  - scipy=1.9.1
  - pandas=1.5.*
  - numba=0.56.*  # Updated for numpy 1.21 compatibility

  # Geospatial packages
  - geopandas
  - fiona  # No version constraint
  - shapely=2.0.1
  - pyproj
  - rasterio=1.3.*

  # Data handling
  - dask>=2022.1.0,<2023
  - xarray>=2022.1.0,<2023
  - h5py=3.9.0
  - h5netcdf
  - netcdf4
  - zarr=2.6.1

  # AWS and web
  - requests=2.31.0
  - s3fs>=2022.1.0
  - fsspec>=2022.1.0

  # Utilities
  - tqdm=4.65.0
  - utm
  - flake8=6.0.0

  # Pip dependencies
  - pip
  - pip:
    - geojson==3.0.1
    - awscliv2==2.2.0
    - rioxarray==0.15.0
    - pystac-client
