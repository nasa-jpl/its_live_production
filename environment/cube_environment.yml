  - numpy=2.2.5
  - geopandas=1.1.0
  - pandas=2.3.0
  - numba=0.61
  - h5py=3.14
  - h5netcdf=1.6
  - h3-py=4.2.2
  - requests=2.32
  - pyproj=3.7
  - xarray=2025.4.0
  - netcdf4=1.7.2
  - flake8=7.2
  - scipy=1.15
  - s3fs=2025.5.1
  - fsspec=2025.5.1
  - shapely=2.1
  - tqdm=4.67
  - utm=0.7
  - zarr<3.0.0a
  - geojson=3.2
  - awscli
  - rasterio=1.4.3
